name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published version tag to repair, for example v0.1.0
        required: true
        type: string
      repair_pypi:
        description: Repair the PyPI publication from existing GitHub Release assets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$RELEASE_TAG is not reachable from origin/main; refusing to release." >&2
            exit 1
          fi
          python3 -I - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}"
              )
          PY
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install "3.12"
          uv sync --locked --extra dev --python "3.12"

      - name: Run release quality gates
        run: |
          uv run ruff check src tests scripts deploy_huggingface_space.py deploy_modal.py
          uv run pip-audit --local --skip-editable
          uv run python -m pytest -q

      - name: Build and validate Python distributions
        run: |
          uv build --no-build-isolation
          uv run twine check dist/*

      - name: Store validated Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
    steps:
      - name: Download validated Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "Expected exactly one wheel and one source distribution" >&2
            exit 1
          fi
          wheel_name="$(basename "${wheels[0]}")"
          sdist_name="$(basename "${sdists[0]}")"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            (
              cd dist
              sha256sum "$wheel_name" "$sdist_name" > SHA256SUMS
            )
            gh release create "$RELEASE_TAG" \
              "${wheels[0]}" \
              "${sdists[0]}" \
              dist/SHA256SUMS \
              --verify-tag \
              --title "PaperSqueeze $RELEASE_TAG" \
              --generate-notes
            exit 0
          fi

          asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          wheel_exists=false
          sdist_exists=false
          checksum_exists=false
          assets_changed=false
          grep -Fxq -- "$wheel_name" <<<"$asset_names" && wheel_exists=true
          grep -Fxq -- "$sdist_name" <<<"$asset_names" && sdist_exists=true
          grep -Fxq -- "SHA256SUMS" <<<"$asset_names" && checksum_exists=true

          if [[ "$wheel_exists" == false ]]; then
            gh release upload "$RELEASE_TAG" "${wheels[0]}"
            assets_changed=true
          else
            echo "$wheel_name already exists; leaving it unchanged."
          fi
          if [[ "$sdist_exists" == false ]]; then
            gh release upload "$RELEASE_TAG" "${sdists[0]}"
            assets_changed=true
          else
            echo "$sdist_name already exists; leaving it unchanged."
          fi

          if [[ "$checksum_exists" == false || "$assets_changed" == true ]]; then
            release_json="$(gh release view "$RELEASE_TAG" --json assets)"
            wheel_digest="$(
              jq -r --arg name "$wheel_name" \
                '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
            )"
            sdist_digest="$(
              jq -r --arg name "$sdist_name" \
                '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
            )"
            if [[ ! "$wheel_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || [[ ! "$sdist_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "GitHub did not return valid SHA-256 asset digests." >&2
              exit 1
            fi
            printf '%s  %s\n%s  %s\n' \
              "${wheel_digest#sha256:}" "$wheel_name" \
              "${sdist_digest#sha256:}" "$sdist_name" \
              > dist/SHA256SUMS
            if [[ "$checksum_exists" == true ]]; then
              gh release upload "$RELEASE_TAG" dist/SHA256SUMS --clobber
            else
              gh release upload "$RELEASE_TAG" dist/SHA256SUMS
            fi
          else
            echo "SHA256SUMS already exists; leaving it unchanged."
          fi

      - name: Publish tested versioned GHCR image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          source_image="$image:$RELEASE_REVISION"
          echo "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT

          manifest_exists() {
            local output
            if output="$(docker manifest inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -Fqi -- "manifest unknown" <<<"$output"; then
              return 1
            fi
            echo "Unable to inspect $1: $output" >&2
            return 2
          }

          if manifest_exists "$source_image"; then
            docker pull "$source_image"
          else
            status=$?
            if (( status == 1 )); then
              echo "CI image $source_image does not exist; refusing to release." >&2
            fi
            exit "$status"
          fi
          source_id="$(docker image inspect --format '{{.Id}}' "$source_image")"

          publish_alias() {
            local alias=$1
            local alias_id
            local status
            if manifest_exists "$alias"; then
              docker pull "$alias"
              alias_id="$(docker image inspect --format '{{.Id}}' "$alias")"
              if [[ "$alias_id" != "$source_id" ]]; then
                echo "$alias does not match tested image $source_image." >&2
                return 1
              fi
              echo "$alias already points to the tested image; leaving it unchanged."
              return 0
            else
              status=$?
              (( status == 1 )) || return "$status"
              docker tag "$source_image" "$alias"
              docker push "$alias"
            fi
          }

          publish_alias "$image:$RELEASE_TAG"
          publish_alias "$image:$version"
          docker manifest inspect "$image:$RELEASE_TAG" >/dev/null
          docker manifest inspect "$image:$version" >/dev/null

  pypi_preflight:
    needs: [validate, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Download validated Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Prepare distributions for PyPI
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/pypi_release.py prepare \
            --project papersqueeze \
            --version "${RELEASE_TAG#v}" \
            --source dist \
            --staging pypi-dist \
            --manifest pypi-manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Store PyPI manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-manifest
          path: pypi-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Store staged PyPI distributions
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: pypi-dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  pypi_publish:
    needs: pypi_preflight
    if: needs.pypi_preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/papersqueeze
    permissions:
      id-token: write
    steps:
      - name: Download staged PyPI distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: pypi-dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  pypi_verify:
    needs: [pypi_preflight, pypi_publish]
    if: >-
      always() &&
      needs.pypi_preflight.result == 'success' &&
      (needs.pypi_publish.result == 'success' ||
       needs.pypi_publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ github.ref_name }}
          persist-credentials: false

      - name: Download PyPI manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-manifest
          path: .

      - name: Verify PyPI distributions
        run: |
          python3 -I scripts/pypi_release.py verify \
            --manifest pypi-manifest.json \
            --attempts 12 \
            --delay-seconds 15

  resolve_backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Require tag dispatch for PyPI repair
        if: inputs.repair_pypi
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "PyPI repair must be dispatched from ref $RELEASE_TAG." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve existing release revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$RELEASE_TAG is not reachable from origin/main; refusing to repair." >&2
            exit 1
          fi
          python3 -I - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}"
              )
          PY
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backfill:
    needs: resolve_backfill
    if: github.event_name == 'workflow_dispatch' && inputs.repair_pypi != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REVISION: ${{ needs.resolve_backfill.outputs.revision }}
    steps:
      - name: Repair release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json assets)"
          mapfile -t wheels < <(
            jq -r '.assets[] | select(.name | endswith(".whl")) | .name' \
              <<<"$release_json"
          )
          mapfile -t sdists < <(
            jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .name' \
              <<<"$release_json"
          )
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "Existing release must contain exactly one wheel and one sdist." >&2
            exit 1
          fi

          wheel_digest="$(
            jq -r --arg name "${wheels[0]}" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
          )"
          sdist_digest="$(
            jq -r --arg name "${sdists[0]}" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
          )"
          if [[ ! "$wheel_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || [[ ! "$sdist_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GitHub did not return valid SHA-256 asset digests." >&2
            exit 1
          fi
          mkdir -p /tmp/release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "${wheels[0]}" \
            --dir /tmp/release-assets
          gh release download "$RELEASE_TAG" \
            --pattern "${sdists[0]}" \
            --dir /tmp/release-assets
          read -r wheel_hash _ < <(
            sha256sum "/tmp/release-assets/${wheels[0]}"
          )
          read -r sdist_hash _ < <(
            sha256sum "/tmp/release-assets/${sdists[0]}"
          )
          if [[ "sha256:$wheel_hash" != "$wheel_digest" ]] \
            || [[ "sha256:$sdist_hash" != "$sdist_digest" ]]; then
            echo "Downloaded asset hashes do not match GitHub's recorded digests." >&2
            exit 1
          fi
          printf '%s  %s\n%s  %s\n' \
            "$wheel_hash" "${wheels[0]}" \
            "$sdist_hash" "${sdists[0]}" \
            > /tmp/SHA256SUMS

          if jq -e '.assets[] | select(.name == "SHA256SUMS")' \
            <<<"$release_json" >/dev/null; then
            gh release upload "$RELEASE_TAG" /tmp/SHA256SUMS --clobber
          else
            gh release upload "$RELEASE_TAG" /tmp/SHA256SUMS
          fi

      - name: Repair versioned GHCR aliases
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          source_image="$image:$RELEASE_REVISION"
          echo "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT

          manifest_exists() {
            local output
            if output="$(docker manifest inspect "$1" 2>&1)"; then
              return 0
            fi
            if grep -Fqi -- "manifest unknown" <<<"$output"; then
              return 1
            fi
            echo "Unable to inspect $1: $output" >&2
            return 2
          }

          if manifest_exists "$source_image"; then
            docker pull "$source_image"
          else
            status=$?
            if (( status == 1 )); then
              echo "CI image $source_image does not exist; refusing to release." >&2
            fi
            exit "$status"
          fi
          source_id="$(docker image inspect --format '{{.Id}}' "$source_image")"

          publish_alias() {
            local alias=$1
            local alias_id
            local status
            if manifest_exists "$alias"; then
              docker pull "$alias"
              alias_id="$(docker image inspect --format '{{.Id}}' "$alias")"
              if [[ "$alias_id" != "$source_id" ]]; then
                echo "$alias does not match tested image $source_image." >&2
                return 1
              fi
              echo "$alias already points to the tested image; leaving it unchanged."
              return 0
            else
              status=$?
              (( status == 1 )) || return "$status"
              docker tag "$source_image" "$alias"
              docker push "$alias"
            fi
          }

          publish_alias "$image:$RELEASE_TAG"
          publish_alias "$image:$version"
          docker manifest inspect "$image:$RELEASE_TAG" >/dev/null
          docker manifest inspect "$image:$version" >/dev/null

  pypi_repair_preflight:
    needs: resolve_backfill
    if: github.event_name == 'workflow_dispatch' && inputs.repair_pypi == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      revision: ${{ needs.resolve_backfill.outputs.revision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.resolve_backfill.outputs.revision }}
          persist-credentials: false

      - name: Download verified GitHub Release distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json assets)"
          mapfile -t wheels < <(
            jq -r '.assets[] | select(.name | endswith(".whl")) | .name' \
              <<<"$release_json"
          )
          mapfile -t sdists < <(
            jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .name' \
              <<<"$release_json"
          )
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "Existing release must contain exactly one wheel and one sdist." >&2
            exit 1
          fi

          wheel_digest="$(
            jq -r --arg name "${wheels[0]}" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
          )"
          sdist_digest="$(
            jq -r --arg name "${sdists[0]}" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
          )"
          if [[ ! "$wheel_digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || [[ ! "$sdist_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "GitHub did not return valid SHA-256 asset digests." >&2
            exit 1
          fi

          mkdir -p repair-dist
          gh release download "$RELEASE_TAG" \
            --pattern "${wheels[0]}" \
            --dir repair-dist
          gh release download "$RELEASE_TAG" \
            --pattern "${sdists[0]}" \
            --dir repair-dist
          read -r wheel_hash _ < <(sha256sum "repair-dist/${wheels[0]}")
          read -r sdist_hash _ < <(sha256sum "repair-dist/${sdists[0]}")
          if [[ "sha256:$wheel_hash" != "$wheel_digest" ]] \
            || [[ "sha256:$sdist_hash" != "$sdist_digest" ]]; then
            echo "Downloaded asset hashes do not match GitHub's recorded digests." >&2
            exit 1
          fi

      - name: Prepare repaired distributions for PyPI
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/pypi_release.py prepare \
            --project papersqueeze \
            --version "${RELEASE_TAG#v}" \
            --source repair-dist \
            --staging pypi-repair-dist \
            --manifest pypi-repair-manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Store PyPI repair manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-repair-manifest
          path: pypi-repair-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Store staged PyPI repair distributions
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-repair-distributions
          path: pypi-repair-dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  pypi_repair_publish:
    needs: pypi_repair_preflight
    if: >-
      inputs.repair_pypi == true &&
      needs.pypi_repair_preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/papersqueeze
    permissions:
      id-token: write
    steps:
      - name: Download staged PyPI repair distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-repair-distributions
          path: pypi-repair-dist/

      - name: Publish repaired distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: pypi-repair-dist/
          skip-existing: true

  pypi_repair_verify:
    needs: [pypi_repair_preflight, pypi_repair_publish]
    if: >-
      always() &&
      inputs.repair_pypi == true &&
      needs.pypi_repair_preflight.result == 'success' &&
      (needs.pypi_repair_publish.result == 'success' ||
       needs.pypi_repair_publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.pypi_repair_preflight.outputs.revision }}
          persist-credentials: false

      - name: Download PyPI repair manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-repair-manifest
          path: .

      - name: Verify repaired PyPI distributions
        run: |

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev
      - run: uv run python -m pytest -q
      - run: uv build

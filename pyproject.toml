[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-image-compressor"
version = "0.1.0"
description = "Target-aware PDF compressor that preserves searchable text, links, and vector content."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/asimfish/pdf-image-compressor"
Repository = "https://github.com/asimfish/pdf-image-compressor.git"
Issues = "https://github.com/asimfish/pdf-image-compressor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.22",
    "pip-audit>=2.10.1",
    "httpx2>=2.7.0",
    "numpy>=2.2.6",
    "scikit-image>=0.25.2",
]

[project.scripts]
file-compressor = "file_compressor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_compressor = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

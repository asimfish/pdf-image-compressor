<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Manager</title>
  <script src="/static/vendor/tailwind.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .drop-zone.drag-over { border-color: #3b82f6; background: #eff6ff; }
    .fade-in { animation: fadeIn .2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<div x-data="app()" x-init="loadLibrary()" @keydown.ctrl.k.window.prevent="$refs.searchInput.focus()" @keydown.ctrl.u.window.prevent="showUpload = true" @keydown.ctrl.b.window.prevent="if (pdfs.length > 0) batchCompress()" class="max-w-6xl mx-auto px-4 py-8">
  <div x-show="apiError" x-cloak class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3">
    <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
    </svg>
    <div class="flex-1">
      <p class="text-red-800 font-medium text-sm">Cannot connect to server</p>
      <p class="text-red-600 text-xs">Make sure the server is running: <code class="bg-red-100 px-1 rounded">uv run file-compressor web</code></p>
    </div>
    <button @click="loadLibrary()" class="px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-xs font-medium hover:bg-red-200 transition">Retry</button>
  </div>
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">PDF Manager</h1>
      <p class="text-sm text-gray-500 mt-1">Upload, compress, and manage your PDF library</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right text-sm text-gray-500" x-show="stats">
        <span x-text="stats?.pdf_count + ' PDFs'"></span>
        <span class="mx-1">·</span>
        <span x-text="stats?.version_count + ' versions'"></span>
        <span class="mx-1">·</span>
        <span x-text="fmtSize(stats?.total_original_bytes)"></span>
        <template x-if="stats?.total_saved_bytes > 0">
          <span class="ml-2 text-green-600 font-medium" x-text="'saved ' + fmtSize(stats.total_saved_bytes)"></span>
        </template>
      </div>
      <button @click="showUpload = true" title="Ctrl+U"
        class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">
        + Upload PDF
      </button>
      <button @click="batchCompress()" :disabled="batchCompressing || filteredPdfs.length === 0" title="Ctrl+B"
        class="px-4 py-2.5 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        <span x-show="!batchCompressing" x-text="filteredPdfs.length < pdfs.length ? 'Compress Filtered (' + filteredPdfs.length + ')' : 'Compress All'"></span>
        <span x-show="batchCompressing">Compressing...</span>
      </button>
      <button @click="selectMode = !selectMode; selectedPdfs = {}"
        class="px-4 py-2.5 rounded-xl font-semibold transition shadow-sm"
        :class="selectMode ? 'bg-gray-600 text-white hover:bg-gray-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'">
        <span x-text="selectMode ? 'Cancel' : 'Select'"></span>
      </button>
      <button x-show="selectMode && Object.keys(selectedPdfs).length > 0" @click="batchDelete()"
        class="px-4 py-2.5 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 transition shadow-sm">
        Delete (<span x-text="Object.keys(selectedPdfs).length"></span>)
      </button>
      <button x-show="selectMode" @click="selectAll()" class="text-sm text-blue-600 hover:text-blue-800 font-medium"
        x-text="Object.keys(selectedPdfs).length === filteredPdfs.length ? 'Deselect All' : 'Select All (' + filteredPdfs.length + ')'"></button>
    </div>
  </header>
  <div class="mb-6 flex gap-3">
    <div class="flex-1 relative">
      <input type="text" x-model="search" x-ref="searchInput" placeholder="Search PDFs... (Ctrl+K)"
        @keydown.escape.window="$refs.searchInput.blur(); search = ''"
        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
      <svg class="absolute left-3 top-3 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <button x-show="search.trim()" @click="search = ''; $refs.searchInput.focus()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">&times;</button>
      <kbd x-show="!search.trim()" class="absolute right-3 top-2.5 text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200">Ctrl+K</kbd>
    </div>
    <select x-model="sortBy" class="px-3 py-2.5 rounded-xl border border-gray-200 bg-white text-sm text-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none">
      <option value="date">Newest</option>
      <option value="name">Name</option>
      <option value="size">Largest</option>
      <option value="savings">Most Saved</option>
    </select>
  </div>
  <div class="mb-6 flex gap-2">
    <template x-for="tab in ['All', 'Uncompressed', 'Compressed']" :key="tab">
      <button @click="filterTab = tab" class="px-3 py-1.5 rounded-lg text-sm font-medium transition"
        :class="filterTab === tab ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
        x-text="tab + (tab === 'Uncompressed' ? ' (' + uncompressedCount + ')' : tab === 'Compressed' ? ' (' + compressedCount + ')' : '')"></button>
    </template>
  </div>
  <div x-show="loading" class="text-center py-20">
    <svg class="w-10 h-10 mx-auto text-blue-500 animate-spin mb-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    <p class="text-gray-400">Loading library...</p>
  </div>
  <div x-show="filteredPdfs.length === 0 && !loading" class="text-center py-20">
    <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
    </svg>
    <p class="text-gray-500 text-lg" x-text="search.trim() || filterTab !== 'All' ? 'No matching PDFs' : 'No PDFs yet'"></p>
    <p class="text-gray-400 text-sm mt-1" x-text="search.trim() || filterTab !== 'All' ? 'Try a different search or filter' : 'Upload your first PDF to get started'"></p>
    <button x-show="!search.trim() && filterTab === 'All'" @click="showUpload = true" class="mt-4 px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition shadow-sm">+ Upload PDF</button>
  </div>
  <div class="grid gap-4" x-show="filteredPdfs.length > 0">
    <template x-for="pdf in filteredPdfs" :key="pdf.id">
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition fade-in">
        <div class="flex items-start gap-4 p-5 cursor-pointer" @click="selectMode ? toggleSelect(pdf.id) : toggleExpand(pdf.id)">
          <div x-show="selectMode" @click.stop class="flex items-center pt-1">
            <input type="checkbox" :checked="selectedPdfs[pdf.id]" @change="toggleSelect(pdf.id)"
              class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
          </div>
          <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center flex-shrink-0">
            <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold text-gray-800 truncate" x-text="pdf.filename"></h3>
            <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
              <span x-text="fmtSize(pdf.file_size)"></span>
              <span x-text="pdf.page_count + ' pages'"></span>
              <span x-text="fmtDate(pdf.upload_time)"></span>
            </div>
            <div x-show="pdf.notes" class="text-sm text-gray-400 mt-1 truncate" x-text="pdf.notes"></div>
            <template x-if="bestVersion(pdf)">
              <div class="mt-2 flex items-center gap-2">
                <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                  <div class="h-full bg-green-400 rounded-full transition-all"
                    :style="'width:' + Math.min(100, bestVersion(pdf).file_size / pdf.file_size * 100) + '%'"></div>
                </div>
                <span class="text-xs text-gray-500 whitespace-nowrap"
                  x-text="fmtSize(bestVersion(pdf).file_size) + ' / ' + fmtSize(pdf.file_size)"></span>
              </div>
            </template>
          </div>
          <div class="flex items-center gap-2" @click.stop>
            <template x-if="bestSaving(pdf) !== 0">
              <span class="text-xs px-2 py-1 rounded-full font-medium"
                :class="bestSaving(pdf) > 0 ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-600'"
                x-text="fmtSaving(bestSaving(pdf))"></span>
            </template>
            <template x-if="bestVersion(pdf)">
              <a :href="'/api/versions/' + bestVersion(pdf).id + '/download'" target="_blank"
                class="p-1.5 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition"
                title="Download best version">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
              </a>
            </template>
            <span class="text-xs px-2 py-1 rounded-full bg-blue-50 text-blue-600 font-medium cursor-pointer"
              x-text="(pdf.version_count || (versionCache[pdf.id] || []).length) + ' versions'"
              @click="toggleExpand(pdf.id)"></span>
            <svg class="w-5 h-5 text-gray-400 transition-transform cursor-pointer" :class="expanded === pdf.id && 'rotate-180'"
              fill="none" stroke="currentColor" viewBox="0 0 24 24"
              @click="toggleExpand(pdf.id)">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <!-- Expanded Panel -->
        <div x-show="expanded === pdf.id" x-collapse class="border-t border-gray-100">
          <div class="p-5">
            <div class="flex items-center gap-2 mb-4">
              <button @click="compressPdf(pdf)" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 transition">+ New Compression</button>
              <a :href="'/api/pdfs/' + pdf.id + '/download'" target="_blank" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Download Original</a>
              <button @click="editNotes(pdf)" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition">Edit Notes</button>
              <button @click="deletePdf(pdf)" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition ml-auto">Delete</button>
            </div>
            <div x-show="versionLoading[pdf.id]" class="text-sm text-gray-400 py-4 text-center">
              <svg class="w-5 h-5 mx-auto text-gray-300 animate-spin mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
              Loading versions...
            </div>
            <div x-show="!versionLoading[pdf.id] && versionCache[pdf.id] !== undefined && versionCache[pdf.id].length === 0" class="text-sm text-gray-400 py-4 text-center">
              No compressed versions yet. Click "New Compression" to create one.
            </div>
            <div class="space-y-2" x-show="(versionCache[pdf.id] || []).length > 0">
              <template x-for="v in (versionCache[pdf.id] || [])" :key="v.id">
                <div class="flex items-center gap-4 p-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition">
                  <div class="flex-1 min-w-0">
                    <div class="font-medium text-sm text-gray-800">
                      <span x-text="v.label"></span>
                      <span x-show="bestVersion(pdf)?.file_size === v.file_size && (versionCache[pdf.id] || []).length > 1" class="ml-1 text-xs px-1.5 py-0.5 rounded bg-green-100 text-green-700">best</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-500 mt-0.5 flex-wrap">
                      <span x-text="fmtSize(v.file_size) + ' / ' + fmtSize(pdf.file_size)"></span>
                      <span x-show="v.compression_ratio > 0" class="text-green-600 font-medium" x-text="'-' + (v.compression_ratio * 100).toFixed(1) + '% (' + fmtSize(pdf.file_size - v.file_size) + ' saved)'"></span>
                      <span x-show="v.compression_ratio === 0" class="text-amber-500">no change</span>
                      <span x-show="v.compression_ratio < 0" class="text-amber-600 font-medium" x-text="fmtSaving(v.compression_ratio) + ' (' + fmtSize(v.file_size - pdf.file_size) + ')'"></span>
                      <span class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-600" x-text="'Q' + v.quality + ' ' + v.pdf_mode + ' ' + v.pdf_dpi + 'dpi' + (v.pdf_grayscale ? ' gray' : '')"></span>
                      <span x-show="!v.strip_metadata" class="px-1.5 py-0.5 rounded bg-amber-50 text-amber-600">metadata kept</span>
                      <span x-show="v.target_bytes" class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-600" x-text="'target ' + fmtSize(v.target_bytes)"></span>
                      <span x-text="fmtDate(v.created_at)"></span>
                    </div>
                  </div>
                  <a :href="'/api/versions/' + v.id + '/download'" target="_blank" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium hover:bg-blue-700 transition">Download</a>
                  <button @click="reuseSettings(pdf, v)" class="px-3 py-1.5 text-gray-500 rounded-lg text-xs font-medium hover:bg-gray-200 transition" title="Reuse these settings">Reuse</button>
                  <button @click="deleteVersion(pdf.id, v.id)" class="px-3 py-1.5 text-red-500 rounded-lg text-xs font-medium hover:bg-red-50 transition">Delete</button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
  <div x-show="showUpload" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
    @click.self="showUpload = false; uploadFiles = []" @keydown.escape.window="if (showUpload) { showUpload = false; uploadFiles = [] }"
    @keydown.enter.window="if (showUpload && uploadFiles.length > 0 && !uploading && !uploadValidation) doUpload()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 p-6 fade-in" @click.stop>
      <h2 class="text-xl font-bold mb-4">Upload PDF</h2>
      <div class="drop-zone border-2 border-dashed border-gray-300 rounded-xl p-8 text-center mb-5 transition" :class="dragOver && 'drag-over'" @dragover.prevent="dragOver = true" @dragleave="dragOver = false" @drop.prevent="handleDrop($event)" @click="$refs.fileInput.click()">
        <input type="file" accept=".pdf" multiple x-ref="fileInput" class="hidden" @change="handleFiles($event.target.files); $event.target.value = ''">
        <svg class="w-10 h-10 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p class="text-gray-600 font-medium">Drop PDFs here or click to browse</p>
        <p class="text-sm text-gray-400 mt-1" x-show="uploadFiles.length > 0" x-text="uploadFiles.length + ' file(s) selected — ' + fmtSize(uploadFiles.reduce((s, f) => s + f.size, 0))"></p>
      </div>
      <!-- Selected Files -->
      <div x-show="uploadFiles.length > 0" class="mb-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-gray-400" x-text="uploadFiles.length + ' file(s)'"></span>
          <button x-show="uploadFiles.length > 1" @click="uploadFiles = []" class="text-xs text-gray-400 hover:text-red-500 transition">Clear all</button>
        </div>
        <div class="space-y-1">
          <template x-for="(f, i) in uploadFiles" :key="i">
            <div class="flex items-center gap-2 text-sm text-gray-600">
              <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/></svg>
              <span class="truncate flex-1" x-text="f.name"></span>
              <span class="text-gray-400" x-text="fmtSize(f.size)"></span>
              <button @click="uploadFiles.splice(i, 1)" class="text-gray-400 hover:text-red-500">&times;</button>
            </div>
          </template>
        </div>
      </div>
      <!-- Compression Settings -->
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Target Size</label>
          <input type="text" x-model="uploadForm.target_size" placeholder="e.g. 500KB, 2MB" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
          <div class="flex gap-1.5 mt-1.5 flex-wrap">
            <template x-for="preset in presets" :key="preset">
              <button type="button" @click="uploadForm.target_size = preset" class="px-2 py-0.5 text-xs rounded-md border transition" :class="uploadForm.target_size === preset ? 'bg-blue-100 border-blue-300 text-blue-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'" x-text="preset"></button>
            </template>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Quality (1-95)</label>
          <input type="number" x-model.number="uploadForm.quality" min="1" max="95" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PDF Mode</label>
          <select x-model="uploadForm.pdf_mode" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
            <option value="auto">Auto</option>
            <option value="optimize">Optimize (keep text)</option>
            <option value="raster">Raster (max compression)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DPI</label>
          <input type="number" x-model.number="uploadForm.pdf_dpi" min="36" max="300" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
        </div>
      </div>
      <div class="flex items-center gap-4 mb-5">
        <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" x-model="uploadForm.pdf_grayscale" class="rounded"> Grayscale</label>
        <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" x-model="uploadForm.strip_metadata" class="rounded"> Strip metadata</label>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
        <textarea x-model="uploadForm.notes" maxlength="5000" rows="2" placeholder="Add a note..." class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm resize-none"></textarea>
        <span class="text-xs mt-0.5 block" :class="uploadForm.notes.length > 4500 ? 'text-amber-500' : 'text-gray-400'" x-text="uploadForm.notes.length > 0 ? uploadForm.notes.length + ' / 5000' : ''"></span>
      </div>
      <!-- Validation Errors -->
      <div x-show="uploadValidation" class="mb-3 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-center gap-2">
        <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        <span x-text="uploadValidation"></span>
      </div>
      <div x-show="uploading" class="mt-4">
        <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full bg-blue-600 rounded-full transition-all" :style="'width:' + uploadProgress + '%'"></div>
        </div>
        <p class="text-sm text-gray-500 mt-1 text-center" x-text="uploadStatus"></p>
        <button @click.stop="cancelUpload()" class="mt-2 text-sm text-gray-500 hover:text-red-600 transition mx-auto block">Cancel</button>
      </div>
      <!-- Actions -->
      <div class="flex gap-3 mt-5">
        <button @click="showUpload = false; uploadFiles = []" class="flex-1 py-2.5 rounded-xl border border-gray-200 font-medium hover:bg-gray-50 transition">Cancel</button>
        <button @click="doUpload()" x-effect="$el.disabled = uploadFiles.length === 0 || uploading || !!uploadValidation" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition disabled:opacity-40 disabled:cursor-not-allowed">Upload & Compress</button>
      </div>
    </div>
  </div>
  <!-- Compress Modal -->
  <div x-show="showCompress" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"

      <div class="flex gap-3 mt-5">

  <!-- Batch Compress Modal -->
  <div x-show="showBatchCompress" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"

      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>

          <div class="flex gap-1.5 mt-1.5 flex-wrap">
            <template x-for="preset in presets" :key="preset">
              <button type="button" @click="batchForm.target_size = preset" class="px-2 py-0.5 text-xs rounded-md border transition" :class="batchForm.target_size === preset ? 'bg-blue-100 border-blue-300 text-blue-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'" x-text="preset"></button>
            </template>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Quality</label>
          <input type="number" x-model.number="batchForm.quality" min="1" max="95" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PDF Mode</label>
          <select x-model="batchForm.pdf_mode" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
            <option value="auto">Auto</option>
            <option value="optimize">Optimize (keep text)</option>
            <option value="raster">Raster (max compression)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DPI</label>
          <input type="number" x-model.number="batchForm.pdf_dpi" min="36" max="300" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
        </div>
      </div>
      <div class="flex items-center gap-4 mb-5">
        <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" x-model="batchForm.pdf_grayscale" class="rounded"> Grayscale</label>
        <label class="flex items-center gap-2 text-sm text-gray-700"><input type="checkbox" x-model="batchForm.strip_metadata" class="rounded"> Strip metadata</label>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Version Label</label>
        <input type="text" x-model="batchForm.label" maxlength="500" placeholder="e.g. Batch v2" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm">
      </div>
      <div x-show="batchCompressing" class="mt-4">
        <div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-green-600 rounded-full animate-pulse w-full"></div></div>
        <p class="text-sm text-gray-500 mt-1 text-center" x-text="'Compressing ' + batchTargetPdfs.length + ' PDFs...'"></p>
      </div>
      <div x-show="batchCompressValidation" class="mt-3 text-sm text-red-600" x-text="batchCompressValidation"></div>
      <div class="flex gap-3 mt-5">
        <button @click="showBatchCompress = false" class="flex-1 py-2.5 rounded-xl border border-gray-200 font-medium hover:bg-gray-50 transition">Cancel</button>
        <button @click="doBatchCompress()" x-effect="$el.disabled = batchCompressing || !!batchCompressValidation" class="flex-1 py-2.5 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition disabled:opacity-40 disabled:cursor-not-allowed" x-text="batchTargetPdfs.length < pdfs.length ? 'Compress ' + batchTargetPdfs.length : 'Compress All'"></button>
    </div>
  </div>
  <!-- Notes Modal -->
  <div x-show="showNotes" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
    @click.self="showNotes = false; notesTarget = null" @keydown.escape.window="if (showNotes) { showNotes = false; notesTarget = null }">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6 fade-in" @click.stop>
      <h2 class="text-xl font-bold mb-4">Edit Notes</h2>
      <textarea x-model="notesText" rows="4" maxlength="5000" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm resize-none"></textarea>
      <div class="flex items-center justify-between mt-1">
        <span class="text-xs" :class="notesText.length > 5000 ? 'text-red-500' : notesText.length > 4500 ? 'text-amber-500' : 'text-gray-400'" x-text="notesText.length + ' / 5000'"></span>
      </div>
      <div class="flex gap-3 mt-4">
        <button @click="showNotes = false; notesTarget = null" class="flex-1 py-2.5 rounded-xl border border-gray-200 font-medium hover:bg-gray-50 transition">Cancel</button>
        <button @click="saveNotes()" :disabled="notesText.length > 5000" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition disabled:opacity-40 disabled:cursor-not-allowed">Save</button>

    class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-lg text-sm font-medium cursor-pointer"
    :class="toastType === 'error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'"
    @click="toast = ''">
    <span x-text="toast"></span>
  </div>
</div>
<script>
function app() {
  return {
    pdfs: [],
    versionCache: {},
    versionLoading: {},
    stats: null,
    search: '',
    sortBy: 'date',
    filterTab: 'All',
    presets: ['200KB', '500KB', '1MB', '2MB', '5MB'],
    expanded: null,
    loading: true,
    apiError: false,
    batchCompressing: false,
    showBatchCompress: false,
    batchForm: { quality: 82, target_size: '', pdf_mode: 'auto', pdf_dpi: 120, pdf_grayscale: false, strip_metadata: true, label: '' },
    selectMode: false,
    selectedPdfs: {},
    // Upload
    showUpload: false,
    uploadFiles: [],
    uploading: false,
    uploadProgress: 0,
    uploadStatus: '',
    dragOver: false,
    uploadForm: { quality: 82, target_size: '', pdf_mode: 'auto', pdf_dpi: 120, pdf_grayscale: false, strip_metadata: true, notes: '' },
    // Compress
    showCompress: false,
    compressTarget: null,
    compressing: false,
    compressForm: { quality: 82, target_size: '500KB', pdf_mode: 'auto', pdf_dpi: 120, pdf_grayscale: false, strip_metadata: true, label: '' },
    // Notes
    batchTargetPdfs: [],
    showNotes: false,
    notesTarget: null,
    notesText: '',
    // Toast
    toast: '',
    toastType: 'success',
    _defaults(extra = {}) { return { quality: 82, target_size: '', pdf_mode: 'auto', pdf_dpi: 120, pdf_grayscale: false, strip_metadata: true, ...extra }; },
    _buildCompressFd(form, extras) {
      const fd = new FormData();
      for (const [k, v] of Object.entries(form)) { if (v !== '' && v != null) fd.append(k, v); }
      if (extras) Object.entries(extras).forEach(([k, v]) => fd.append(k, v));
      return fd;
    },
    _validTargetSize(v) {
      if (!v || !v.trim()) return '';
      return /^\s*\d+(\.\d+)?\s*[kmgt]?\s*b?\s*$/i.test(v) ? '' : 'Invalid target size (e.g. 500KB, 500 KB, 2MB)';
    },
    _validateForm(form) {
      if (!(form.quality >= 1 && form.quality <= 95)) return 'Quality must be between 1 and 95';
      if (!(form.pdf_dpi >= 36 && form.pdf_dpi <= 300)) return 'DPI must be between 36 and 300';
      return this._validTargetSize(form.target_size);
    },
    get uploadValidation() { return this._validateForm(this.uploadForm); },
    get compressValidation() { return this._validateForm(this.compressForm); },
    get batchCompressValidation() { return this._validateForm(this.batchForm); },
    get filteredPdfs() {
      let list = this.pdfs;
      if (this.search.trim()) {
        const q = this.search.toLowerCase();
        list = list.filter(p => p.filename.toLowerCase().includes(q) || (p.notes || '').toLowerCase().includes(q));
      }
      if (this.filterTab === 'Uncompressed') {
        list = list.filter(p => (p.version_count || 0) === 0);
      } else if (this.filterTab === 'Compressed') {
        list = list.filter(p => (p.version_count || 0) > 0);
      }
      const sorted = [...list];
      switch (this.sortBy) {
        case 'name': sorted.sort((a, b) => a.filename.localeCompare(b.filename)); break;
        case 'size': sorted.sort((a, b) => b.file_size - a.file_size); break;
        case 'savings': sorted.sort((a, b) => this.bestSaving(b) - this.bestSaving(a)); break;
        default: sorted.sort((a, b) => b.upload_time.localeCompare(a.upload_time)); break;
      }
      return sorted;
    },
    get uncompressedCount() {
      return this.pdfs.filter(p => (p.version_count || 0) === 0).length;
    },
    get compressedCount() {
      return this.pdfs.filter(p => (p.version_count || 0) > 0).length;
    },
    async loadLibrary() {
      this.loading = true;
      this.apiError = false;
      try {
        const pdfsRes = await fetch('/api/pdfs');
        if (!pdfsRes.ok) throw new Error('Failed to load PDFs');
        this.pdfs = await pdfsRes.json();
        fetch('/api/stats').then(r => r.ok ? r.json() : null).then(d => { if (d) this.stats = d; }).catch(() => {});
      } catch (e) {
        this.apiError = true;
        this.showToast('Failed to load library: ' + e.message, 'error');
      }
      this.loading = false;
    },
    async loadVersions(pdfId) {
      this.versionLoading[pdfId] = true;
      try {
        const res = await fetch(`/api/pdfs/${pdfId}/versions`);
        if (!res.ok) throw new Error('Failed to load versions');
        this.versionCache[pdfId] = await res.json();
      } catch (e) {
        this.showToast('Failed to load versions: ' + e.message, 'error');
      }
      this.versionLoading[pdfId] = false;
    },
    toggleExpand(pdfId) {
      this.expanded = this.expanded === pdfId ? null : pdfId;
      if (this.expanded && !this.versionCache[pdfId]) this.loadVersions(pdfId);
    },
    toggleSelect(pdfId) {
      const n = { ...this.selectedPdfs };
      n[pdfId] ? delete n[pdfId] : n[pdfId] = true;
      this.selectedPdfs = n;
    },
    selectAll() {
      const all = Object.fromEntries(this.filteredPdfs.map(p => [p.id, true]));
      this.selectedPdfs = Object.keys(this.selectedPdfs).length === this.filteredPdfs.length ? {} : all;
    },
    async batchDelete() {
      const ids = Object.keys(this.selectedPdfs);
      if (!confirm(`Delete ${ids.length} PDF(s) and all their versions?`)) return;
      try {
        const res = await fetch('/api/pdfs/batch-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdf_ids: ids }),
        });
        if (!res.ok) throw new Error('Batch delete failed');
        const data = await res.json();
        this.showToast(`Deleted ${data.deleted} PDFs`);
        if (ids.includes(this.expanded)) this.expanded = null;
        this.selectedPdfs = {};
        this.selectMode = false;
        this.loadLibrary();
      } catch (e) {
        this.showToast('Delete failed: ' + e.message, 'error');
      }
    },
    handleDrop(e) {
      this.dragOver = false;
      this._selectFiles([...e.dataTransfer.files]);
    },
    handleFiles(files) {
      this._selectFiles([...files]);
    },
    _selectFiles(all) {
      const MAX = 500 * 1024 * 1024;
      const pdfs = all.filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (!pdfs.length) { this.showToast('Only PDF files are supported', 'error'); return; }
      const valid = pdfs.filter(f => f.size <= MAX);
      const nonPdfCount = all.length - pdfs.length;
      const tooLargeCount = pdfs.length - valid.length;
      const bad = [nonPdfCount > 0 && 'non-PDF', tooLargeCount > 0 && 'too large'].filter(Boolean);
      if (bad.length) this.showToast(`Skipped ${bad.join(', ')} file(s)${!valid.length ? ' — none to upload' : ''}`, valid.length ? 'success' : 'error');
      const existing = new Set(this.uploadFiles.map(f => f.name));
      const newFiles = valid.filter(f => !existing.has(f.name));
      this.uploadFiles = [...this.uploadFiles, ...newFiles];
    },
    async doUpload() {
      if (!this.uploadFiles.length) return;
      this.uploading = true;
      this.uploadProgress = 0;
      this.uploadStatus = 'Uploading...';
      let succeeded = 0; const errors = []; const warnings = []; let uploadedPdf = null;
      for (let i = 0; i < this.uploadFiles.length; i++) {
        const fd = this._buildCompressFd(this.uploadForm, { file: this.uploadFiles[i], notes: this.uploadForm.notes });
        this.uploadStatus = `Uploading ${i + 1}/${this.uploadFiles.length}...`;
        try {
          const data = await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            this._currentXhr = xhr;
            xhr.open('POST', '/api/pdfs/upload');
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const filePct = e.loaded / e.total;
                this.uploadProgress = Math.round(((i + filePct) / this.uploadFiles.length) * 100);
                if (filePct >= 1) this.uploadStatus = `Processing ${i + 1}/${this.uploadFiles.length}...`;
              }
            };
            xhr.onload = () => {
              this._currentXhr = null;
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch { reject(new Error('Invalid response')); }
              } else {
                try { reject(new Error(JSON.parse(xhr.responseText).detail || xhr.statusText)); }
                catch { reject(new Error(xhr.statusText)); }
              }
            };
            xhr.onerror = () => { this._currentXhr = null; reject(new Error('Network error')); };
            xhr.onabort = () => { this._currentXhr = null; reject(new Error('Upload cancelled')); };
            xhr.send(fd);
          });
          if (data.warning) warnings.push(data.warning);
          uploadedPdf = data; succeeded++;
        } catch (e) {
          if (!this.uploading) break;
          errors.push(`${this.uploadFiles[i].name}: ${e.message}`);
        }
        if (!this.uploading) break;
      }
      if (succeeded === 0 && !this.uploading) {
        this.showUpload = false; this.uploadFiles = []; this.showToast('Upload cancelled', 'error'); return;
      }
      this.uploadProgress = 100; this.uploading = false;
      if (succeeded === 0 && errors.length > 0) {
        this.showToast(`Upload failed: ${errors.join('; ')}`, 'error');
        return;
      }
      this.showUpload = false; this.uploadFiles = [];
      this.uploadForm = this._defaults({ notes: '' });
      const parts = [`Uploaded ${succeeded} PDF(s)`];
      if (warnings.length) parts.push(`${warnings.length} warning(s): ${warnings.join('; ')}`);
      if (errors.length) parts.push(`${errors.length} failed: ${errors.join('; ')}`);
      this.showToast(parts.join(', '), errors.length ? 'error' : 'success');
      this.loadLibrary();
      this.compressPdf(uploadedPdf);
    },
    cancelUpload() {
      this.uploading = false;
      if (this._currentXhr) { this._currentXhr.abort(); this._currentXhr = null; }
    },
    batchCompress() {
      this.batchForm = this._defaults({ label: '' });
      this.batchTargetPdfs = this.filteredPdfs;
      this.showBatchCompress = true;
    },
    async doBatchCompress() {
      this.batchCompressing = true;
      try {
        const fd = this._buildCompressFd(this.batchForm);
        if (this.batchTargetPdfs.length < this.pdfs.length) {
          fd.append('pdf_ids', this.batchTargetPdfs.map(p => p.id).join(','));
        }
        const res = await fetch('/api/pdfs/batch-compress', { method: 'POST', body: fd });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Batch compress failed');
        const data = await res.json();
        const errors = (data.results || []).filter(r => r.status === 'error');
        const ok = (data.results || []).filter(r => r.status === 'ok');
        const saved = ok.reduce((s, r) => s + ((r.original_size || 0) - (r.compressed_size || 0)), 0);
        const savedStr = saved > 0 ? ', saved ' + this.fmtSize(saved) : '';
        if (errors.length > 0) {
          this.showToast(`Compressed ${data.compressed}${savedStr}, ${errors.length} failed: ${errors.map(e => e.filename + ' (' + (e.error || 'unknown') + ')').join('; ')}`, 'error');
        } else {
          this.showToast(`Compressed ${data.compressed} PDF(s)${savedStr}`);
        }
        this.loadLibrary();
        this.showBatchCompress = false;
      } catch (e) {
        this.showToast('Batch compress failed: ' + e.message, 'error');
      }
      this.batchCompressing = false;
    },
    compressPdf(pdf) {
      this.compressTarget = pdf;
      const target = pdf.file_size ? Math.max(10000, Math.round(pdf.file_size * 0.5)) : 500000;
      this.compressForm = this._defaults({ target_size: this.fmtSize(target), label: '' });
      this.showCompress = true;
    },
    reuseSettings(pdf, version) {
      this.compressTarget = pdf;
      this.compressForm = {
        quality: version.quality,
        target_size: version.target_bytes ? this.fmtSize(version.target_bytes) : '',
        pdf_mode: version.pdf_mode,
        pdf_dpi: version.pdf_dpi,
        pdf_grayscale: version.pdf_grayscale,
        strip_metadata: version.strip_metadata !== false,
        label: '',
      };
      this.showCompress = true;
    },
    async doCompress() {
      if (!this.compressTarget) return;
      this.compressing = true;
      try {
        const fd = this._buildCompressFd(this.compressForm);
        const res = await fetch(`/api/pdfs/${this.compressTarget.id}/compress`, { method: 'POST', body: fd });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || 'Compression failed');
        }
        const ver = await res.json();
        const ratio = ver.compression_ratio;
        const size = this.fmtSize(ver.file_size);
        const msg = ratio > 0 ? `Compressed: -${(ratio * 100).toFixed(1)}% (${size})` : ratio < 0 ? `Larger: +${(Math.abs(ratio) * 100).toFixed(1)}% → ${size}` : `No change → ${size}`;
        this.showToast(msg);
        this.loadVersions(this.compressTarget.id);
        this.loadLibrary();
        this.showCompress = false;
      } catch (e) {
        this.showToast('Compression failed: ' + e.message, 'error');
      }
      this.compressing = false;
    },
    editNotes(pdf) {
      this.notesTarget = pdf;
      this.notesText = pdf.notes || '';
      this.showNotes = true;
    },
    async saveNotes() {
      if (!this.notesTarget) return;
      try {
        const res = await fetch(`/api/pdfs/${this.notesTarget.id}/notes`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: this.notesText }),
        });
        if (!res.ok) throw new Error('Failed to save notes');
        this.showNotes = false;
        this.loadLibrary();
      } catch (e) {
        this.showToast('Save failed: ' + e.message, 'error');
      }
    },
    async deletePdf(pdf) {
      if (!confirm(`Delete "${pdf.filename}" and all versions?`)) return;
      try {
        const res = await fetch(`/api/pdfs/${pdf.id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        if (this.expanded === pdf.id) this.expanded = null;
        this.showToast('Deleted');
        this.loadLibrary();
      } catch (e) {
        this.showToast('Delete failed: ' + e.message, 'error');
      }
    },
    async deleteVersion(pdfId, versionId) {
      if (!confirm('Delete this version?')) return;
      try {
        const res = await fetch(`/api/versions/${versionId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        this.loadVersions(pdfId);
        this.loadLibrary();
      } catch (e) {
        this.showToast('Delete failed: ' + e.message, 'error');
      }
    },
    bestSaving(pdf) {
      const versions = this.versionCache[pdf.id] || [];
      if (versions.length > 0) return Math.max(...versions.map(v => v.compression_ratio || 0));
      return pdf.best_compression_ratio || 0;
    },
    fmtSaving(r) {
      if (r == null || r === 0) return '';
      return r > 0 ? 'saved ' + (r * 100).toFixed(0) + '%' : '+' + (Math.abs(r) * 100).toFixed(0) + '% larger';
    },
    bestVersion(pdf) {
      const versions = this.versionCache[pdf.id] || [];
      if (versions.length === 0) {
        if (!pdf.best_compressed_size) return null;
        return { id: pdf.best_version_id, file_size: pdf.best_compressed_size };
      }
      return versions.reduce((best, v) => (!best || v.file_size < best.file_size) ? v : best, null);
    },
    fmtSize(bytes) {
      if (bytes == null) return '-';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let v = bytes, u = 0;
      while (v >= 1000 && u < 4) { v /= 1000; u++; }
      const fixed = v.toFixed(u === 0 ? 0 : 1);
      return fixed === '1000.0' && u < 4 ? '1.0 ' + units[u + 1] : fixed + ' ' + units[u];
    },
    fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    },
    showToast(msg, type = 'success') {
      this.toast = msg; this.toastType = type;
      setTimeout(() => { if (this.toast === msg) this.toast = ''; }, type === 'error' ? 8000 : 3000);
    },
  };
}
</script>
